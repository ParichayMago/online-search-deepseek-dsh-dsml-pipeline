version: 1
ideas:
- id: space-heater-fire
  idea: Build a compact 200-400 word live-web request for a real decision-maker who must reduce space-heater
    fire risk across product design, room conditions, incident patterns, recalls, winter energy burden,
    and safer alternatives. Make the hidden solution a dependency-graph, multi-hop research problem rather
    than a checklist. The final report must reconcile independent source families, perform bounded calculations,
    test a compound-failure scenario, and reach a conditional portfolio recommendation.
  scope: 'Consumer Safety; target decision: reduce space-heater fire risk across product design, room
    conditions, incident patterns, recalls, winter energy burden, and safer alternatives; focus: incident
    evidence, exposure, authority, market actors, equity, remedies, and implementation risk'
  as_of: '2026-08-01'
  requester_archetype: professional
  domain: Consumer Safety
  task_mode: dependency_graph_multihop
  required_workstreams:
  - 'space heater fire: consumer hazard and affected-population baseline'
  - 'space heater fire: controlling product, food, health, transport, or housing authority and dates'
  - 'space heater fire: reconstructing the eligible product, incident, market, or location population'
  - 'space heater fire: normalizing units, denominators, exposure windows, and scenario assumptions'
  - 'space heater fire: joining injury, exposure, reliability, cost, and distributional evidence'
  - 'space heater fire: testing manufacturer, retailer, platform, and regulator responsibilities'
  - 'space heater fire: modeling missing data, recalls, counterevidence, and compound failures'
  - 'space heater fire: ranking a bounded safety intervention portfolio with reversal triggers'
