version: 1
ideas:
- id: community-college-completion
  idea: Build a live-web deep-research task for a community coalition preparing to scrutinize a public
    proposal to redesign community-college pathways across placement, advising, transfer, financial aid,
    and completion. Require a cited long-form report that reconstructs controlling authority and chronology,
    joins distributed evidence across the named workstreams, resolves genuine scope/date/definition conflicts,
    performs multiple decision-relevant calculations, rejects evidence-visible near-neighbor substitutions,
    preserves bounded uncertainty, and reaches a conditional bottom line with practical decision triggers.
  scope: 'United States education, learning, and training policy; target decision: redesign community-college
    pathways across placement, advising, transfer, financial aid, and completion'
  requester_archetype: community
  domain: Academic
  task_mode: structured_evidence_reconstruction
  required_workstreams:
  - 'community college completion redesign: student population, participation, and outcome baselines'
  - 'community college completion redesign: federal, state, local, and institutional authority'
  - 'community college completion redesign: eligibility, admissions, placement, and completion rules'
  - 'community college completion redesign: instructional effectiveness and evidence quality'
  - 'community college completion redesign: educator workforce, facilities, and delivery capacity'
  - 'community college completion redesign: funding formulas, student cost, and fiscal sustainability'
  - 'community college completion redesign: disability access, language access, and distributional equity'
  - 'community college completion redesign: credential value, transferability, and labor-market alignment'
  - 'community college completion redesign: counterevidence, measurement limits, and unintended effects'
  - 'community college completion redesign: phasing, evaluation, safeguards, and revision triggers'
- id: baby-food-recall
  idea: Build a compact 200-400 word live-web request for a real decision-maker who must prioritize a
    response to contaminant recalls in infant food across testing, lot traceability, retailer notice,
    caregiver exposure, and replacement supply. Make the hidden solution a dependency-graph, multi-hop
    research problem rather than a checklist. The final report must reconcile independent source families,
    perform bounded calculations, test a compound-failure scenario, and reach a conditional portfolio
    recommendation.
  scope: 'Consumer Safety; target decision: prioritize a response to contaminant recalls in infant food
    across testing, lot traceability, retailer notice, caregiver exposure, and replacement supply; focus:
    incident evidence, exposure, authority, market actors, equity, remedies, and implementation risk'
  requester_archetype: professional
  domain: Consumer Safety
  task_mode: dependency_graph_multihop
  required_workstreams:
  - 'baby food recall: consumer hazard and affected-population baseline'
  - 'baby food recall: controlling product, food, health, transport, or housing authority and dates'
  - 'baby food recall: reconstructing the eligible product, incident, market, or location population'
  - 'baby food recall: normalizing units, denominators, exposure windows, and scenario assumptions'
  - 'baby food recall: joining injury, exposure, reliability, cost, and distributional evidence'
  - 'baby food recall: testing manufacturer, retailer, platform, and regulator responsibilities'
  - 'baby food recall: modeling missing data, recalls, counterevidence, and compound failures'
  - 'baby food recall: ranking a bounded safety intervention portfolio with reversal triggers'
