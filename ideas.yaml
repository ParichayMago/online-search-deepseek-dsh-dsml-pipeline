- id: bearing-supplier-origin
  idea: Build a task-adaptive 200-1,800-word live-web Manufacturing anomaly-detection specification for
    a bearing supplier origin case. Require a structured analyst to reconcile supplier legal identity,
    facility, and origin records, identify lot, supplier, and corrective-action inconsistencies, and distinguish
    Anomaly confirmed, Reconciled, and Insufficient evidence. Require explicit abstention when the evidence
    cannot support a finding, exact inline URLs, and a hold, release, rework, escalation, or CAPA-reopening
    recommendation. Keep the hidden solution a dependency-graph, multi-hop investigation rather than a
    checklist.
  scope: Manufacturing; anomaly detection across lot genealogy, supplier identity, inspection and certificate
    records, nonconformance, corrective and preventive action, release status, chronology, source conflicts,
    and bounded disposition decisions
  requester_archetype: quality_engineering
  domain: Manufacturing
  task_mode: anomaly_detection
  instruction_shape: task_adaptive_200_to_1800_word_specification
  required_workstreams:
  - 'bearing supplier origin: reconstruct lot genealogy and detect identity, quantity, and date inconsistencies'
  - 'bearing supplier origin: match supplier legal names, facilities, certificates, and ownership across
    records'
  - 'bearing supplier origin: compare inspection, certificate, process, and disposition records using
    consistent units'
  - 'bearing supplier origin: trace nonconformances to corrective and preventive actions without treating
    a closure date as proof of effectiveness'
  - 'bearing supplier origin: separate clerical discrepancies, source conflicts, and safety-relevant anomalies'
  - 'bearing supplier origin: verify the controlling manufacturing, quality, and reporting requirements
    on current public sources'
  - 'bearing supplier origin: test source independence, superseded revisions, scope boundaries, and entity
    aliases'
  - 'bearing supplier origin: preserve missing evidence and bounded uncertainty rather than inventing
    a lot or supplier conclusion'
  - 'bearing supplier origin: classify each material finding as Anomaly confirmed, Reconciled, or Insufficient
    evidence'
  - 'bearing supplier origin: recommend hold, release, rework, escalation, or CAPA reopening from the
    reconstructed evidence'
