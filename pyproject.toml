[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "doraemon-online-search"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<0.29",
  "pypdf>=5,<7",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.setuptools]
packages = []
py-modules = ["dsh_home_isolation", "publication_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
