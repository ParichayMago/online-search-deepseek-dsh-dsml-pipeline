version: 1
ideas:
- id: baby-food-recall
  idea: Build a compact 200-400 word live-web request for a real decision-maker who must prioritize a
    response to contaminant recalls in infant food across testing, lot traceability, retailer notice,
    caregiver exposure, and replacement supply. Make the hidden solution a dependency-graph, multi-hop
    research problem rather than a checklist. The final report must reconcile independent source families,
    perform bounded calculations, test a compound-failure scenario, and reach a conditional portfolio
    recommendation.
  scope: 'Consumer Safety; target decision: prioritize a response to contaminant recalls in infant food
    across testing, lot traceability, retailer notice, caregiver exposure, and replacement supply; focus:
    incident evidence, exposure, authority, market actors, equity, remedies, and implementation risk'
  as_of: '2026-08-01'
  requester_archetype: professional
  domain: Consumer Safety
  task_mode: dependency_graph_multihop
  required_workstreams:
  - 'baby food recall: consumer hazard and affected-population baseline'
  - 'baby food recall: controlling product, food, health, transport, or housing authority and dates'
  - 'baby food recall: reconstructing the eligible product, incident, market, or location population'
  - 'baby food recall: normalizing units, denominators, exposure windows, and scenario assumptions'
  - 'baby food recall: joining injury, exposure, reliability, cost, and distributional evidence'
  - 'baby food recall: testing manufacturer, retailer, platform, and regulator responsibilities'
  - 'baby food recall: modeling missing data, recalls, counterevidence, and compound failures'
  - 'baby food recall: ranking a bounded safety intervention portfolio with reversal triggers'
