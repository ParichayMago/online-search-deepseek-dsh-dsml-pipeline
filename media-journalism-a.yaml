version: 1
ideas:
- id: breaking-news-casualty
  idea: Build an exact 120-word live-web newsroom micro-contract requiring a verifier to verify competing
    casualty claims before a breaking-news alert. Require Supported, Contradicted, or Insufficient evidence
    for each material claim, explicit abstention when support is insufficient, exact inline URLs, and
    a publish/hold/correct/retract recommendation. Keep the hidden solution a dependency-graph, multi-hop
    verification problem rather than a checklist.
  scope: 'Media and journalism; verification decision: verify competing casualty claims before a breaking-news
    alert; focus: provenance, source independence, chronology, quantitative normalization, counterevidence,
    uncertainty, abstention, and editorial consequence'
  as_of: '2026-08-01'
  requester_archetype: investigative
  domain: Media and journalism
  task_mode: verification_and_abstention
  instruction_shape: exact_120_word_micro_contract
  required_workstreams:
  - 'breaking news casualty: decomposing the submitted assertion into falsifiable material claims'
  - 'breaking news casualty: tracing each claim to the earliest stable primary record'
  - 'breaking news casualty: testing source independence, syndication, and circular reporting'
  - 'breaking news casualty: resolving entity, location, timestamp, jurisdiction, and version identity'
  - 'breaking news casualty: normalizing quoted numbers, populations, denominators, and time windows'
  - 'breaking news casualty: checking provenance and context separately from content authenticity'
  - 'breaking news casualty: seeking credible counterevidence and preserving unresolved boundaries'
  - 'breaking news casualty: assigning Supported, Contradicted, or Insufficient evidence and deciding
    publish, hold, correct, or retract'
  authoritative_domains: &id001
  - apnews.com
  - reuters.com
  - govinfo.gov
  - archives.gov
  - courtlistener.com
  - sec.gov
