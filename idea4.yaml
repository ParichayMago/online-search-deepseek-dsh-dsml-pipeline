ideas:
- id: ai-hiring-compliance
  idea: Build a live-web deep-research task for an investigative analyst testing competing public claims
    about whether and how to design compliant use and oversight rules for automated hiring and employment
    screening systems. Require a cited long-form report that reconstructs controlling authority and chronology,
    joins distributed evidence across the named workstreams, resolves genuine scope/date/definition conflicts,
    performs multiple decision-relevant calculations, rejects evidence-visible near-neighbor substitutions,
    preserves bounded uncertainty, and reaches a conditional bottom line with practical decision triggers.
  scope: 'United States legal, regulatory, civil-rights, and enforcement policy; target decision: design
    compliant use and oversight rules for automated hiring and employment screening systems'
  as_of: '2026-07-01'
