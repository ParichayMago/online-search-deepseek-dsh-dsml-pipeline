- id: public-access-policy
  idea: Build a live-web deep-research task for an investigative analyst testing competing public claims
    about whether and how to implement public access to federally funded publications while addressing
    repositories, rights, cost, and compliance. Require a cited long-form report that reconstructs controlling
    authority and chronology, joins distributed evidence across the named workstreams, resolves genuine
    scope/date/definition conflicts, performs multiple decision-relevant calculations, rejects evidence-visible
    near-neighbor substitutions, preserves bounded uncertainty, and reaches a conditional bottom line
    with practical decision triggers.
