- id: internet-outage-cause
  idea: Build an exact 120-word live-web newsroom micro-contract requiring a verifier to verify an internet-outage
    attribution across providers, routing evidence, timing, and recovery. Require Supported, Contradicted,
    or Insufficient evidence for each material claim, explicit abstention when support is insufficient,
    exact inline URLs, and a publish/hold/correct/retract recommendation. Keep the hidden solution a dependency-graph,
    multi-hop verification problem rather than a checklist.
  scope: 'Media and journalism; verification decision: verify an internet-outage attribution across providers,
    routing evidence, timing, and recovery; focus: provenance, source independence, chronology, quantitative
    normalization, counterevidence, uncertainty, abstention, and editorial consequence'
  as_of: '2026-08-01'
  requester_archetype: community
  domain: Media and journalism
  task_mode: verification_and_abstention
  instruction_shape: exact_120_word_micro_contract
  required_workstreams:
  - 'internet outage cause: decomposing the submitted assertion into falsifiable material claims'
  - 'internet outage cause: tracing each claim to the earliest stable primary record'
  - 'internet outage cause: testing source independence, syndication, and circular reporting'
  - 'internet outage cause: resolving entity, location, timestamp, jurisdiction, and version identity'
  - 'internet outage cause: normalizing quoted numbers, populations, denominators, and time windows'
  - 'internet outage cause: checking provenance and context separately from content authenticity'
  - 'internet outage cause: seeking credible counterevidence and preserving unresolved boundaries'
  - 'internet outage cause: assigning Supported, Contradicted, or Insufficient evidence and deciding publish,
    hold, correct, or retract'
  authoritative_domains: &id001
  - apnews.com
  - reuters.com
  - govinfo.gov
  - archives.gov
  - courtlistener.com
  - sec.gov
