version: 1
ideas:
- id: sensor-lot-identity
  idea: Build a task-adaptive 200-1,800-word live-web Manufacturing anomaly-detection specification for a sensor
    lot identity case. Require a structured analyst to reconcile lot identifiers, genealogy, and release
    records, identify lot, supplier, and corrective-action inconsistencies, and distinguish Anomaly confirmed,
    Reconciled, and Insufficient evidence. Require explicit abstention when the evidence cannot support
    a finding, exact inline URLs, and a hold, release, rework, escalation, or CAPA-reopening recommendation.
    Keep the hidden solution a dependency-graph, multi-hop investigation rather than a checklist.
  scope: Manufacturing; anomaly detection across lot genealogy, supplier identity, inspection and certificate
    records, nonconformance, corrective and preventive action, release status, chronology, source conflicts,
    and bounded disposition decisions
  as_of: '2026-08-10'
  requester_archetype: operations
  domain: Manufacturing
  task_mode: anomaly_detection
  instruction_shape: task_adaptive_200_to_1800_word_specification
  required_workstreams:
  - 'sensor lot identity: reconstruct lot genealogy and detect identity, quantity, and date inconsistencies'
  - 'sensor lot identity: match supplier legal names, facilities, certificates, and ownership across records'
  - 'sensor lot identity: compare inspection, certificate, process, and disposition records using consistent
    units'
  - 'sensor lot identity: trace nonconformances to corrective and preventive actions without treating
    a closure date as proof of effectiveness'
  - 'sensor lot identity: separate clerical discrepancies, source conflicts, and safety-relevant anomalies'
  - 'sensor lot identity: verify the controlling manufacturing, quality, and reporting requirements on
    current public sources'
  - 'sensor lot identity: test source independence, superseded revisions, scope boundaries, and entity
    aliases'
  - 'sensor lot identity: preserve missing evidence and bounded uncertainty rather than inventing a lot
    or supplier conclusion'
  - 'sensor lot identity: classify each material finding as Anomaly confirmed, Reconciled, or Insufficient
    evidence'
  - 'sensor lot identity: recommend hold, release, rework, escalation, or CAPA reopening from the reconstructed
    evidence'
  authoritative_domains: &id001
  - fda.gov
  - ecfr.gov
  - nist.gov
  - osha.gov
  - iso.org
  - ema.europa.eu
  - echa.europa.eu
  - data.europa.eu
