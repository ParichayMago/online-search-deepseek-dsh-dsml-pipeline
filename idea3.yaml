- id: emergency-shelter-network
  idea: Build a credible first-person live-web research request from someone directly affected by the
    institutional decision about how to redesign an emergency-shelter network for severe weather, displacement,
    disability access, and family continuity, who needs evidence for a well-informed meeting rather than
    personalized professional advice. Require a cited long-form report that reconstructs controlling authority
    and chronology, joins distributed evidence across the named workstreams, resolves genuine scope/date/definition
    conflicts, performs multiple decision-relevant calculations, rejects evidence-visible near-neighbor
    substitutions, preserves bounded uncertainty, and reaches a conditional bottom line with practical
    decision triggers.
