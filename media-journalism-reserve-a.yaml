version: 1
ideas:
- id: agency-report-revision
  idea: Build an exact 120-word live-web newsroom micro-contract requiring a verifier to verify a reported
    agency finding across draft, final, and corrected releases. Require Supported, Contradicted, or Insufficient
    evidence for each material claim, explicit abstention when support is insufficient, exact inline URLs,
    and a publish/hold/correct/retract recommendation. Keep the hidden solution a dependency-graph, multi-hop
    verification problem rather than a checklist.
  scope: 'Media and journalism; verification decision: verify a reported agency finding across draft,
    final, and corrected releases; focus: provenance, source independence, chronology, quantitative normalization,
    counterevidence, uncertainty, abstention, and editorial consequence'
  as_of: '2026-08-01'
  requester_archetype: investigative
  domain: Media and journalism
  task_mode: verification_and_abstention
  instruction_shape: exact_120_word_micro_contract
  required_workstreams:
  - 'agency report revision: decomposing the submitted assertion into falsifiable material claims'
  - 'agency report revision: tracing each claim to the earliest stable primary record'
  - 'agency report revision: testing source independence, syndication, and circular reporting'
  - 'agency report revision: resolving entity, location, timestamp, jurisdiction, and version identity'
  - 'agency report revision: normalizing quoted numbers, populations, denominators, and time windows'
  - 'agency report revision: checking provenance and context separately from content authenticity'
  - 'agency report revision: seeking credible counterevidence and preserving unresolved boundaries'
  - 'agency report revision: assigning Supported, Contradicted, or Insufficient evidence and deciding
    publish, hold, correct, or retract'
  authoritative_domains: &id001
  - apnews.com
  - reuters.com
  - govinfo.gov
  - archives.gov
  - courtlistener.com
  - sec.gov
