version: 1
ideas:
- id: sanctions-list-identity
  idea: Build an exact 120-word live-web newsroom micro-contract requiring a verifier to verify whether
    a named person or entity matches a sanctions-list record. Require Supported, Contradicted, or Insufficient
    evidence for each material claim, explicit abstention when support is insufficient, exact inline URLs,
    and a publish/hold/correct/retract recommendation. Keep the hidden solution a dependency-graph, multi-hop
    verification problem rather than a checklist.
  scope: 'Media and journalism; verification decision: verify whether a named person or entity matches
    a sanctions-list record; focus: provenance, source independence, chronology, quantitative normalization,
    counterevidence, uncertainty, abstention, and editorial consequence'
  as_of: '2026-08-01'
  requester_archetype: community
  domain: Media and journalism
  task_mode: verification_and_abstention
  instruction_shape: exact_120_word_micro_contract
  required_workstreams:
  - 'sanctions list identity: decomposing the submitted assertion into falsifiable material claims'
  - 'sanctions list identity: tracing each claim to the earliest stable primary record'
  - 'sanctions list identity: testing source independence, syndication, and circular reporting'
  - 'sanctions list identity: resolving entity, location, timestamp, jurisdiction, and version identity'
  - 'sanctions list identity: normalizing quoted numbers, populations, denominators, and time windows'
  - 'sanctions list identity: checking provenance and context separately from content authenticity'
  - 'sanctions list identity: seeking credible counterevidence and preserving unresolved boundaries'
  - 'sanctions list identity: assigning Supported, Contradicted, or Insufficient evidence and deciding
    publish, hold, correct, or retract'
  authoritative_domains: &id001
  - apnews.com
  - reuters.com
  - govinfo.gov
  - archives.gov
  - courtlistener.com
  - sec.gov
