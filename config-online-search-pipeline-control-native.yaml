# Generated by scripts/generate_online_search_benchmark_configs.py.
# Taxonomy-balanced lane variant; deployment is intentionally disabled.
yggdrasil_ref: codex/rolling-success-target
name: online-search-taxonomy-balanced-control-native
domain: taxonomy-balanced-online-search
runner:
  pw_harness_ref: litelite-soloist-codx-auth
  pw_harness_repo: https://github.com/Parsewave-internal/pw-harness.git
  pw_harness_path: ~/.cache/doraemon/pw-harness
environment:
  type: docker
ideation:
  type: custom
  source: ${DORAEMON_IDEA_SOURCE}
build:
  agent: codex
  model: gpt-5.6-sol
  reasoning_effort: xhigh
  fast_mode: false
  pattern: from_scratch
  retry_budget: 0
preflight:
  word_limit: 350
  required_files: &id001
  - environment/Dockerfile
  - instruction.md
  - solution/evidence_graph.json
  - solution/report.md
  - solution/solve.sh
  - task.toml
  - tests/Dockerfile
  - tests/reference/ground_truth.json
  - tests/rubrics.json
  - tests/test.sh
  - tests/test_outputs.py
  - tests/test_utils.py
oracle:
  expected_score: 0.9
  nop_expected: 0.0
difficulty:
  solver_timeout_sec: 10800
  solver_lane:
  - agent: codex
    model: meta-muse-spark
    reasoning_effort: xhigh
    trials: 3
  aggregation: band
  target_band:
  - 0.0
  - 1.0
  max_number_of_zeros: null
  lowest_allowed_max_score: null
  minimum_fresh_input_tokens: null
  fresh_input_aggregation: mean
deploy:
  target_repo: Parsewave-internal/online-search
  clone_from: main
  pr_base: main
  branch_pattern: online-search/{id}
  subdir: contributor_tasks
traces:
  s3_bucket: parsewave-multi-modal-jobs
  s3_prefix: online-search/benchmark-traces/online-search-taxonomy-balanced-control-native
  write_toml: false
pipeline:
- step: doraemon.idea_file_pick_no_wrap
- step: doraemon.domain_taxonomy
  params:
    taxonomy_file: domain-taxonomy.yaml
- step: doraemon.semantic_identity
  params:
    words: 3
- step: setup.instantiate_template
  params:
    template: example-task
- step: doraemon.restore_canonical
- step: benchmark.build_lane
  params:
    lane: control-native
    instructions_file: prompts/author_online_search_current.md
    timeout_sec: 5400
- step: doraemon.restore_canonical
- step: doraemon.semantic_massage
  params:
    instructions_file: prompts/massage_online_search_task.md
    timeout_sec: 3600
- step: doraemon.restore_canonical
- step: postbuild.unicode_normalize
  params:
    files:
    - instruction.md
    - task.toml
- step: preflight.required_files
  params:
    files: *id001
- step: preflight.word_limit
  params:
    file: instruction.md
    limit: 350
- step: doraemon.validate_live_task
  params:
    mode: capture
    timeout_sec: 420
- step: doraemon.validate_live_task
  params:
    mode: verify
    timeout_sec: 420
- step: doraemon.oracle_min_score
  params:
    minimum: 0.9
- step: doraemon.validate_live_task
  params:
    mode: verify
    timeout_sec: 420
- step: doraemon.muse_solver_lane
  params:
    trials: 3
    max_attempts: 4
- step: doraemon.publication_gate
  params:
    maximum_mean_score: 0.8
    minimum_max_peak_call_context: 500000
- step: postbuild.cleanup
  params:
    patterns:
    - task-planning
    - .codex-logs
    - output
    - __pycache__
    - '*.pyc'
    - .DS_Store
- step: doraemon.validate_live_task
  params:
    mode: package
