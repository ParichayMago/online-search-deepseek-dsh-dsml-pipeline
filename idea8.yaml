- id: avian-influenza-resilience
  idea: Build a credible first-person live-web research request from someone directly affected by the
    institutional decision about how to coordinate avian-influenza surveillance, farm biosecurity, worker
    protection, depopulation, vaccination, and market continuity, who needs evidence for a well-informed
    meeting rather than personalized professional advice. Require a cited long-form report that reconstructs
    controlling authority and chronology, joins distributed evidence across the named workstreams, resolves
    genuine scope/date/definition conflicts, performs multiple decision-relevant calculations, rejects
    evidence-visible near-neighbor substitutions, preserves bounded uncertainty, and reaches a conditional
    bottom line with practical decision triggers.
