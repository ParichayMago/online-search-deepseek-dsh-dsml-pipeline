version: 1
ideas:
- id: bearing-lot-identity
  idea: Build a task-adaptive 200-1,800-word live-web Manufacturing anomaly-detection specification for
    a bearing lot identity case. Require a structured analyst to reconcile lot identifiers, genealogy,
    and release records, identify lot, supplier, and corrective-action inconsistencies, and distinguish
    Anomaly confirmed, Reconciled, and Insufficient evidence. Require explicit abstention when the evidence
    cannot support a finding, exact inline URLs, and a hold, release, rework, escalation, or CAPA-reopening
    recommendation. Keep the hidden solution a dependency-graph, multi-hop investigation rather than a
    checklist.
  scope: Manufacturing; anomaly detection across lot genealogy, supplier identity, inspection and certificate
    records, nonconformance, corrective and preventive action, release status, chronology, source conflicts,
    and bounded disposition decisions
  requester_archetype: quality_engineering
  domain: Manufacturing
  task_mode: anomaly_detection
  instruction_shape: task_adaptive_200_to_1800_word_specification
  required_workstreams:
  - 'bearing lot identity: reconstruct lot genealogy and detect identity, quantity, and date inconsistencies'
  - 'bearing lot identity: match supplier legal names, facilities, certificates, and ownership across
    records'
  - 'bearing lot identity: compare inspection, certificate, process, and disposition records using consistent
    units'
  - 'bearing lot identity: trace nonconformances to corrective and preventive actions without treating
    a closure date as proof of effectiveness'
  - 'bearing lot identity: separate clerical discrepancies, source conflicts, and safety-relevant anomalies'
  - 'bearing lot identity: verify the controlling manufacturing, quality, and reporting requirements on
    current public sources'
  - 'bearing lot identity: test source independence, superseded revisions, scope boundaries, and entity
    aliases'
  - 'bearing lot identity: preserve missing evidence and bounded uncertainty rather than inventing a lot
    or supplier conclusion'
  - 'bearing lot identity: classify each material finding as Anomaly confirmed, Reconciled, or Insufficient
    evidence'
  - 'bearing lot identity: recommend hold, release, rework, escalation, or CAPA reopening from the reconstructed
    evidence'
- id: smart-appliance-data
  idea: Build a credible first-person live-web research request from someone directly affected by the
    institutional decision about how to govern smart-appliance data collection, retention, sharing, updates,
    and loss of functionality, who needs evidence for a well-informed meeting rather than personalized
    professional advice. Require a cited long-form report that reconstructs controlling authority and
